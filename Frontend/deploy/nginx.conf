# TechHub 前端部署配置
# 用法:把本文件内容替换 nginx 的 conf/nginx.conf(或 include 进来),然后启动 nginx

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;                 # 访问 http://localhost (80 被占用就改成 8081 等)
        server_name  localhost;

        # 前端打包产物目录(改成你自己的 dist 绝对路径)
        root   D:/MyJavaProject/Frontend/dist;
        index  index.html;

        # vue-router history 模式:刷新子路由 404 时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源可长期缓存
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # 后端接口反向代理
        # 注意:proxy_pass 后面【不要】加斜杠 /,这样会保留 /api 前缀原样转发
        # 前端请求 /api/xxx -> 转发到 http://localhost:8080/api/xxx
        location /api/ {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
