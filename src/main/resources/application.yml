spring:
  application:
    name: techhub
  profiles:
    active: dev
  servlet:
    multipart:
      # 头像上传大小上限(超出会报 Maximum upload size exceeded)
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mybatis-plus:
  configuration:
    # 下划线转驼峰:created_at -> createdAt
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 已关闭:压测/生产时控制台打印会严重拖慢性能。
    # 需要调试 SQL 时,临时取消下面这行注释即可
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略:自增
      id-type: auto
  # 自定义 SQL 的 XML 位置(后续复杂查询写这里)
  mapper-locations: classpath*:mapper/*.xml
jwt:
  # HS256 秘钥:从环境变量 JWT_USER_SECRET_KEY 注入,禁止明文提交到仓库。
  # 本地开发在 IDEA 运行配置里设;生产用 K8s Secret / 部署平台的环境变量注入。
  user-secret-key: ${JWT_USER_SECRET_KEY}
  # token 有效期(毫秒),这里示例 24 小时
  user-ttl: 86400000